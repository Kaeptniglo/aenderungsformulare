spring.application.name=aenderungsformulare
# Hosting-Dienste (Render, Fly, Heroku) geben den Port per Umgebungsvariable PORT vor
server.port=${PORT:8080}

# Zugangsschutz (HTTP Basic Auth). Lokal aus; beim Hosting per Umgebungsvariablen
# APP_AUTH_ENABLED=true, APP_AUTH_BENUTZER=..., APP_AUTH_PASSWORT=... einschalten.
app.auth.enabled=false
app.auth.benutzer=demo
app.auth.passwort=

# Vaadin
vaadin.launch-browser=false
# Nur die eigenen Pakete nach Routen/Komponenten scannen (schnellerer Start)
vaadin.allowed-packages=com.demo.formulare

# Anbindung Dokumenterstellungs-System
# false = simulierter Client (loggt die Nutzdaten und liefert eine Fake-Dokument-ID)
# true  = echter REST-Aufruf gegen dokumente.api.base-url
dokumente.api.enabled=false
dokumente.api.base-url=http://localhost:9000
dokumente.api.pfad=/api/dokumente

logging.level.com.demo.formulare=DEBUG
